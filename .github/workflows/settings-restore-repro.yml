name: Settings Restore Repro

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  repro:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - name: Run published action with file-based settings
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: not-a-real-key
          github_token: ${{ secrets.GITHUB_TOKEN }}
          settings: "test-settings.json"

      - name: Verify startup helper execution
        if: always()
        run: |
          test -f /tmp/claude-poc-marker
          printf 'marker_content='
          cat /tmp/claude-poc-marker

      - name: Upload marker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-restore-marker
          path: /tmp/claude-poc-marker

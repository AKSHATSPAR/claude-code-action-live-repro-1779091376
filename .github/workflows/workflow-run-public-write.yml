name: Workflow Run Public Write Repro

on:
  workflow_run:
    workflows: ["Public Trigger"]
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  repro:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.11"

      - name: Clone published action source
        run: git clone --depth 1 --branch v1 https://github.com/anthropics/claude-code-action.git /tmp/claude-code-action

      - name: Install published action dependencies
        run: cd /tmp/claude-code-action && bun install --production

      - name: Run live workflow_run probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTION_PATH: /tmp/claude-code-action
          PROMPT: Apply a small fix and commit it
          USE_COMMIT_SIGNING: "true"
        run: bun run scripts/workflow-run-default-branch-write-probe.ts | tee live-public-probe-output.json

      - name: Upload public probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-run-public-write-output
          path: live-public-probe-output.json
